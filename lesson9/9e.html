<!DOCTYPE html>
<html>

<head>
    <title>7g problem</title>
    <style>
        .image {
            height: 50px;
            width: 50px;
            border-radius: 25px;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 5px;
        }

        .input {
            vertical-align: middle;
            color: grey;
            font-size: 20px;
            border: none;
            width: 300px;
            margin-right: 0;
        }

        .tweet-button {
            background-color: rgb(45, 81, 189);
            color: rgb(255 255 255);
            border: none;
            margin-left: 0;
            padding-bottom: 5px;
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 5px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;

        }

        .div {
            background-color: white;
            align-items: center;
            padding-bottom: 5px;
            padding-top: 5px;
            padding-left: 10px;
            width: 480px;
            border-radius: 4px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <div class="div">
        <img class="image" src="throne.jpg" alt="">
        <input class="input" type="text" placeholder="What's happeing?">
        <button class="tweet-button">Tweet</button>

    </div>
</body>

</html>
