<!DOCTYPE html>
<html>

<head>
    <title>8c problem</title>
    <style>
        .div {
            text-align: center;
        }

        .input {
            border: none;
            width: 490px;
            font-size: 15px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            padding: 12px 16px;
            outline: none;
            margin-top: 0;
        }

        .img {
            width: 280px;
            height: 120px;
            margin-bottom: 0;
        }

        .search {
            font-family: arial;
            background-color: rgb(239, 237, 237);
            font-size: 15px;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 8px;
            padding-bottom: 8px;
            border: none;
            margin-top: 35px;
            margin-right: 5px;
            
        }

        .feel {
            font-family: arial;
            background-color: rgb(239, 237, 237);
            font-size: 15px;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 8px;
            padding-bottom: 8px;
            border: none;
        }
    </style>
</head>

<body>
    <div class="div">
        <img src="google.jpg" alt="" class="img">

    </div>
    <div class="div">
        <input class="input" type="text" placeholder="Search Google or type a URL">

    </div>
    <div class="div">
        <button class="search">Google Search</button>
        <button class="feel">I'm Feeling Lucky</button>
    </div>

</body>

</html>
